<!doctype html>
<!-- The old GitHub Pages address. Control Center moved to Cloudflare (npm run deploy publishes dist/ there);
     this page only sends people on. Hand-written, not built. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'sha256-VUVHCjsu6MZGDitKGvT33lYhCJnhYzLwKv8P86Jjy98='; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta http-equiv="refresh" content="3; url=https://control-center.smcontrolcenter.workers.dev/">
<title>Control Center has moved</title>
<style>
:root{color-scheme:light dark;--bg:#fafafa;--fg:#111;--muted:#666}
@media (prefers-color-scheme:dark){:root{--bg:#0e0e0e;--fg:#f2f2f2;--muted:#9a9a9a}}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:420px;padding:32px 24px}
h1{font-size:22px;margin:0 0 6px}
p{margin:0 0 20px;color:var(--muted)}
a{display:inline-block;padding:10px 16px;border-radius:10px;background:var(--fg);color:var(--bg);text-decoration:none;font-weight:600}
</style>
</head>
<body>
<main>
<h1>Control Center has moved</h1>
<p>It's now at control-center.smcontrolcenter.workers.dev. Taking you there…</p>
<a id="go" href="https://control-center.smcontrolcenter.workers.dev/">Open Control Center</a>
</main>
<script>
// Keep the store link working: #/store here → #/store there.
document.getElementById('go').href = 'https://control-center.smcontrolcenter.workers.dev/' + location.hash;
setTimeout(function () { location.replace(document.getElementById('go').href); }, 1500);
</script>
</body>
</html>
